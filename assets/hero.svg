<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Hyprveil — privacy, with a little atmosphere</title>
  <desc id="desc">A native Hyprland plugin with Satin, Telegram, black, omit and image capture styles. A crossed-eye symbol appears beside the name.</desc>
  <defs>
    <linearGradient id="base" x2="1" y2="1"><stop stop-color="#142522"/><stop offset="1" stop-color="#101719"/></linearGradient>
    <radialGradient id="light"><stop stop-color="#a6d9c6" stop-opacity=".1"/><stop offset="1" stop-color="#a6d9c6" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="320" rx="20" fill="url(#base)"/>
  <ellipse cx="1040" cy="168" rx="270" ry="220" fill="url(#light)"/>
  <rect x=".5" y=".5" width="1279" height="319" rx="19.5" fill="none" stroke="#a6d9c6" stroke-opacity=".14"/>
  <g font-family="Liberation Sans, Arial, sans-serif">
    <text x="72" y="57" fill="#a7c9b8" font-size="13" letter-spacing="2.8">NATIVE HYPRLAND PLUGIN</text>
    <text x="68" y="151" fill="#f2f0e8" font-size="88" font-weight="700" letter-spacing="-3">Hyprveil</text>
    <text x="73" y="197" fill="#b4c4bb" font-size="25">Privacy, with a little atmosphere.</text>
    <text x="74" y="265" fill="#91ad9e" font-size="13" letter-spacing="2.1">SATIN  /  TELEGRAM  /  BLACK  /  OMIT  /  IMAGE</text>
  </g>
  <g transform="translate(921 97)" fill="none" stroke="#bfd8c7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 66C66-3 150-3 202 66C150 135 66 135 14 66Z" opacity=".82"/>
    <circle cx="108" cy="66" r="29" opacity=".82"/>
    <path d="M42 0L174 132" stroke="#14201e" stroke-width="15"/>
    <path d="M42 0L174 132"/>
  </g>
</svg>
